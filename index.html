  <script>
    // Decide antes da primeira pintura se a intro aparece (evita "piscar" quando está desligada).
    // Também decide se as animações ficam reduzidas (preferência do sistema, a menos que a usuária force).
    (function (h) {
      var d = {};
      try { d = JSON.parse(localStorage.getItem('js-app-dados') || '{}') || {}; } catch (e) { /* sem dados */ }
      var s = d.settings || {};
      // Para onde o app abre. Com treino em andamento: direto na execução, sem a intro.
      // Sem treino em andamento: como sempre (intro + Início), a menos que a usuária escolha o Treino.
      // settings.openWorkout: 'auto' (padrão: Início) | 'dias' (Treino nos dias de treino) | 'sempre' (Treino).
      // ('nunca', de versões antigas, vale como 'auto'.)
      window.JS_OPEN = function (d, now) {
        if (!d || typeof d !== 'object') return null;
        var st = d.settings || {}, mode = st.openWorkout || 'auto';
        var ses = d.workoutSessions || [];
        var p = function (n) { return (n < 10 ? '0' : '') + n; };
        var key = now.getFullYear() + '-' + p(now.getMonth() + 1) + '-' + p(now.getDate());
        // Treino em andamento: abre nele se for de hoje ou se teve série nas últimas 6 horas
        // (conta a partir da última série, não só do início do treino).
        var lastAct = function (x) {
          var t = new Date(x.startedAt).getTime() || 0;
          (x.items || []).forEach(function (it) { (it && it.sets || []).forEach(function (st) { var a = new Date(st && st.at).getTime(); if (a > t) t = a; }); });
          return t;
        };
        for (var i = 0; i < ses.length; i++) {
          if (ses[i] && ses[i].status === 'active' && (ses[i].date === key || now - lastAct(ses[i]) < 6 * 3600000)) return 'sessao';
        }
        if (mode !== 'dias' && mode !== 'sempre') return null;
        var plans = d.workoutPlans || [];
        if (!plans.length) return null;
        if (mode === 'sempre') return 'treino';
        var w = d.workout || {}, id = (w.overrides && w.overrides[key]) || (w.week && w.week[now.getDay()]);
        if (!id || id === 'rest' || !plans.some(function (x) { return x && x.id === id; })) return null;
        return ses.some(function (x) { return x && x.date === key && x.status === 'done'; }) ? null : 'treino';
      };
      var asked = (location.hash || '').replace(/^#\/?/, '');
      var auto = window.JS_OPEN(d, new Date()), nav = '';
      try { nav = ((performance.getEntriesByType('navigation') || [])[0] || {}).type || ''; } catch (e) { /* navegador antigo */ }
      // #/registro (atalho "Registro rápido" do ícone): abre a telinha, também sem a intro.
      // Com treino em andamento, abrir o app sempre leva para ele, mesmo que o endereço guardado
      // no ícone tenha outra aba (ex.: #/inicio). Só recarregar a página mantém a aba que estava aberta.
      var target = asked === 'registro' ? 'registro' : (auto === 'sessao' && nav !== 'reload') ? 'sessao' : asked ? null : auto;
      if (target && target !== 'registro') history.replaceState(null, '', '#/' + target);
      window.JS_OPENED_TARGET = target;
      // Abrindo direto no treino, pula a intro (é para ser rápido).
      if (s.intro !== false && !target) h.classList.add('intro-on');
      var sys = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (sys && s.animations !== 'on') h.classList.add('reduce-motion');

      // Aparência, antes da primeira pintura (sem piscar): tema e paleta de cores.
      //  - settings.theme: 'auto' (padrão: segue o modo claro/escuro do celular) | 'light' | 'dark';
      //  - settings.palette: 'rose' (padrão) | 'lavanda' | 'pessego' | 'nude'.
      // No <html>: data-theme só quando a usuária força; data-palette só fora do rosé (css/style.css).
      var THEME_COLORS = { rose: ['#FFF7FA', '#20151B'], lavanda: ['#FAF7FD', '#1A1621'], pessego: ['#FFF8F4', '#221915'], nude: ['#FBF8F6', '#1F1A18'] };
      window.JS_THEME = function (theme, palette, animate) {
        var de = document.documentElement;
        theme = theme === 'dark' || theme === 'light' ? theme : 'auto';
        palette = THEME_COLORS[palette] ? palette : 'rose';
        if (animate && window.requestAnimationFrame) {
          de.classList.add('theme-anim');
          clearTimeout(window.JS_THEME_T);
          window.JS_THEME_T = setTimeout(function () { de.classList.remove('theme-anim'); }, 450);
        }
        if (theme === 'auto') de.removeAttribute('data-theme'); else de.setAttribute('data-theme', theme);
        if (palette === 'rose') de.removeAttribute('data-palette'); else de.setAttribute('data-palette', palette);
        // Cor da barra do sistema: uma para o claro e outra para o escuro (no automático, o celular escolhe).
        var c = THEME_COLORS[palette], metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          var forDark = (metas[i].getAttribute('media') || '').indexOf('dark') >= 0;
          metas[i].setAttribute('content', c[theme === 'auto' ? (forDark ? 1 : 0) : (theme === 'dark' ? 1 : 0)]);
        }
        var cs = document.querySelector('meta[name="color-scheme"]');
        if (cs) cs.setAttribute('content', theme === 'auto' ? 'light dark' : theme);
        var sysDark = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        window.JS_THEME_STATE = { theme: theme, palette: palette, dark: theme === 'dark' || (theme === 'auto' && sysDark) };
        return window.JS_THEME_STATE;
      };
      window.JS_THEME(s.theme, s.palette);
      // Celular mudou de claro para escuro (ou o contrário) com o app aberto, no automático.
      try {
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
          var st = window.JS_THEME_STATE || {};
          window.JS_THEME(st.theme, st.palette);
        });
      } catch (e) { /* navegador antigo */ }

      // Tamanho da tela. Todo o CSS é em rem; aqui se escolhe quanto vale 1rem (100% = 16px).
      //  - celular: 100%;
      //  - tablet (tela de toque grande): aumenta conforme o tamanho da tela, até 160%;
      //  - computador com tela larga: aumenta um pouco, até 135%;
      //  - navegador encolhendo a página (ex.: "site para computador" no tablet desenha a página com
      //    980 px numa tela menor): compensa, para tudo ficar do tamanho certo;
      //  - settings.uiScale: 'auto' (padrão) ou um número escolhido em Configurações (0.9, 1, 1.15...).
      window.JS_FIT = function (choice) {
        var de = document.documentElement;
        var mm = function (q) { return !!(window.matchMedia && matchMedia(q).matches); };
        var lw = de.clientWidth || window.innerWidth || 0, lh = window.innerHeight || de.clientHeight || 0;
        if (!lw || !lh) return 1;
        var touch = mm('(pointer: coarse)') || (navigator.maxTouchPoints > 0 && !mm('(pointer: fine)'));
        var sw = screen.width || 0, sh = screen.height || 0, screenW = lw > lh ? Math.max(sw, sh) : Math.min(sw, sh);
        var comp = touch && screenW > 200 && lw > screenW * 1.04 ? lw / screenW : 1;
        var W = lw / comp, short = Math.min(W, lh / comp), k = 1, manual = Number(choice);
        var isManual = !!(choice && choice !== 'auto' && manual > 0);
        if (isManual) {
          k = Math.min(manual, Math.max(1, W / 320)); // escolha da usuária: só não deixa a tela "menor que um celular"
        } else {
          if (short >= 560) k = touch ? Math.min(Math.max(short / 700, 1), 1.6) : W >= 1000 ? Math.min(Math.max(W / 1440, 1), 1.35) : 1;
          // Mantém o desenho da tela (celular / tablet / tela grande) coerente com a largura que sobra.
          var tier = lw >= 1000 ? 1000 : lw >= 700 ? 700 : lw >= 640 ? 640 : 320;
          k = Math.min(k, Math.max(1, W / tier));
        }
        var f = Math.round(k * comp * 1000) / 1000;
        de.style.fontSize = f === 1 ? '' : (f * 100).toFixed(1) + '%';
        window.JS_SCALE = { applied: f, scale: k, comp: comp, auto: !isManual };
        return f;
      };
      window.JS_FIT(s.uiScale);
      // Girou a tela ou mudou o tamanho da janela: recalcula.
      var fitTimer = null;
      window.addEventListener('resize', function () {
        clearTimeout(fitTimer);
        fitTimer = setTimeout(function () {
          var cur = {};
          try { cur = (JSON.parse(localStorage.getItem('js-app-dados') || '{}') || {}).settings || {}; } catch (e) { /* sem dados */ }
          window.JS_FIT(cur.uiScale);
        }, 100);
      });
    })(document.documentElement);
  </script>
